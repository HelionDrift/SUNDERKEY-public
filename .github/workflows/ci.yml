name: Candidate Smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: candidate-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts --select E,F
      - run: python scripts/build_offline_specialist_components.py --check
      - name: Run Focused Source Checks
        run: >-
          python -m unittest
          tests.agents.test_readme_navigation
          tests.agents.test_documentation_index
          tests.agents.test_identity_phase4
          tests.agents.test_trust_phase4
          tests.agents.test_cli_phase4
          tests.agents.test_offline_api_source_ledger.OfflineApiSourceLedgerTests.test_distinct_retest_batches_retain_order_and_identity
          tests.agents.test_offline_api_expectation_attestation.OfflineApiExpectationAttestationTests.test_signed_assertions_bind_exact_case_without_authority
          tests.agents.test_offline_task_review_receipts.OfflineTaskReviewReceiptTests.test_signed_reviews_bind_work_product_but_grant_no_positive_use
          tests.agents.test_offline_specialist_components.OfflineSpecialistComponentsTests.test_published_catalog_fits_bound_and_round_trips_current_sources
