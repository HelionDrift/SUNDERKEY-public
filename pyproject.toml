[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunderkey"
version = "0.1.0"
description = "Signals Unmasking, Network Discovery, Exploitation, & Reconnaissance control plane"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=49,<50",
]

[project.optional-dependencies]
dev = [
  "python-docx>=1.2,<2",
  "jsonschema[format-nongpl]>=4.23,<5",
  "ruff>=0.12,<1",
]

[project.scripts]
sunderkey = "sunderkey.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
